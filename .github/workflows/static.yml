name: Verify and deploy Auradio website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auradio-site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Stamp the deployment identity
        run: printf '%s\n' "$GITHUB_SHA" > dist/build-id.txt
      - run: npm audit --omit=dev --audit-level=high
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Verify production pages and interactions
        run: python scripts/browser-qa.py --output qa-output
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auradio-browser-evidence
          path: qa-output/
          retention-days: 14
      - name: Build artifact
        uses: actions/upload-artifact@v4
        with:
          name: auradio-built-site
          path: dist/
          retention-days: 14
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check the actual public HTTPS site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/live-smoke.py --url "$SITE_URL" --sha "$GITHUB_SHA" --output live-check.json
      - name: Public deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auradio-live-check
          path: live-check.json
          retention-days: 14
