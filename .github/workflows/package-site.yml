name: Package and verify Auradio website
on:
  push:
    branches: ['site/interactive-astro']
    paths: ['.github/workflows/package-site.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auradio-package
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply public-only editorial update
        run: |
          if test -f scripts/prepare-public-delivery.py; then python scripts/prepare-public-delivery.py; fi
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/browser-qa.py');s=p.read_text()
          s=re.sub(r"(?m)^( +)no_overflow\(page, f'desktop ([^\n]+)\n +page.screenshot([^\n]+)", lambda m:m[1]+"no_overflow(page, f'desktop "+m[2]+"\n"+m[1]+"page.screenshot"+m[3],s)
          s=s.replace("handler = functools.partial(QuietHandler, directory=str(public))", "import sys\n    sys.path.insert(0,str(ROOT))\n    from serve import Handler\n    handler = Handler")
          p.write_text(s)
          compile(s,str(p),'exec')
          PY
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test && npm run check && npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Prepare browser and CJK rendering
        run: |
          python -m pip install playwright==1.57.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
      - name: Verify real browser interactions
        run: python scripts/browser-qa.py --output qa-output
      - name: Archive readable website source
        if: always()
        run: |
          python - <<'PY'
          import pathlib,tarfile,shutil
          root=pathlib.Path('.')
          outdir=pathlib.Path('delivery-artifact');outdir.mkdir(exist_ok=True)
          with tarfile.open(outdir/'website-checked-source.tar.gz','w:gz') as out:
            for p in root.rglob('*'):
              if p.is_file() and not any(x in p.parts for x in ('.git','node_modules','dist','.astro','qa-output','__pycache__','.delivery','delivery-artifact')) and p.suffix not in ('.wav','.map'):
                out.add(p,arcname=str(p))
          if pathlib.Path('dist').exists():shutil.copytree('dist',outdir/'dist',dirs_exist_ok=True)
          if pathlib.Path('qa-output').exists():shutil.copytree('qa-output',outdir/'qa-output',dirs_exist_ok=True)
          PY
      - name: Save rendered evidence and complete build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auradio-final-check
          path: delivery-artifact/
          retention-days: 3
      - name: Save verified source in website branch
        if: success()
        run: |
          rm -rf delivery-artifact
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m '官网：保存已核验的交互网站与精简公开文案'
            git push origin HEAD:site/interactive-astro
          fi
