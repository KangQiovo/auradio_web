name: Verify Windows local preview
on:
  push:
    branches: [main]
    paths: ['serve.ps1','.github/workflows/windows-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify PowerShell fallback without Node or Python
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/audio | Out-Null
          Set-Content -Encoding UTF8 dist/index.html '<!doctype html><title>Auradio</title><h1>Local preview</h1>'
          Set-Content -Encoding UTF8 dist/404.html '<h1>Not found</h1>'
          [IO.File]::WriteAllBytes((Join-Path $PWD 'dist/audio/test.wav'), [byte[]](0..255))
          $process=Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',"$PWD/serve.ps1",'-NoOpen') -PassThru -RedirectStandardOutput preview-out.txt -RedirectStandardError preview-error.txt
          try {
            $ready=$false
            for($i=0;$i -lt 20;$i++) {
              try { $response=Invoke-WebRequest 'http://127.0.0.1:4173/auradio_web/' -TimeoutSec 2; $ready=$response.StatusCode -eq 200; if($ready){break} } catch { Start-Sleep -Milliseconds 500 }
            }
            if(-not $ready){throw ('Preview did not start: '+(Get-Content preview-error.txt -Raw))}
            if($response.Content -notmatch 'Local preview'){throw 'Unexpected homepage'}
            $range=Invoke-WebRequest 'http://127.0.0.1:4173/auradio_web/audio/test.wav' -Headers @{Range='bytes=0-43'}
            if($range.StatusCode -ne 206 -or $range.RawContentLength -ne 44){throw 'Audio range response failed'}
            $head=Invoke-WebRequest 'http://127.0.0.1:4173/auradio_web/audio/test.wav' -Method Head
            if($head.Headers['Content-Length'] -ne '256'){throw 'HEAD length failed'}
            $blocked=Invoke-WebRequest 'http://127.0.0.1:4173/auradio_web/package.json' -SkipHttpErrorCheck
            if($blocked.StatusCode -ne 404){throw 'Source isolation failed'}
            $write=Invoke-WebRequest 'http://127.0.0.1:4173/auradio_web/' -Method Post -SkipHttpErrorCheck
            if($write.StatusCode -ne 405){throw 'Write request not rejected'}
            Write-Host 'PASS Windows PowerShell: startup, HTML, media Range 206, HEAD, source isolation, write rejection'
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
