name: Verify interactive Auradio website
on:
  push:
    branches: ['site/interactive-astro']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: auradio-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the verified stylesheet transport
        if: hashFiles('.delivery/styles.css.gz') != ''
        run: |
          python - <<'PY'
          import gzip,hashlib,pathlib
          data=gzip.decompress(pathlib.Path('.delivery/styles.css.gz').read_bytes())
          assert hashlib.sha256(data).hexdigest() == '9179a3e21f3b781e9a179086d1d87fff1bc613637b3c5fe7ddab11593409a4e2'
          path=pathlib.Path('src/styles/global.css');path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          PY
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test && npm run check && npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Real desktop and mobile interaction checks
        run: python scripts/browser-qa.py --output qa-output
      - name: Save build and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auradio-website-qa
          path: |
            qa-output/
            dist/
          retention-days: 14
      - name: Commit verified source stylesheet and dependency lock
        if: success() && github.ref == 'refs/heads/site/interactive-astro'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/global.css package-lock.json
          if test -f .delivery/styles.css.gz; then git rm .delivery/styles.css.gz; fi
          if ! git diff --cached --quiet; then
            git commit -m '构建：保存已通过浏览器回归的完整样式与依赖锁'
            git push origin HEAD:site/interactive-astro
          fi
