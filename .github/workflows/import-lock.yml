name: Import verified dependency lock
on:
  push:
    branches: ['site/interactive-astro']
    paths: ['.github/workflows/import-lock.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    if: github.ref == 'refs/heads/site/interactive-astro'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/interactive-astro
      - uses: actions/download-artifact@v4
        with:
          name: astro-toolchain
          run-id: 35579787919
          github-token: ${{ github.token }}
          path: /tmp/auradio-verified-toolchain
      - name: Import only the verified package manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/auradio-package-manifests
          tar -xzf /tmp/auradio-verified-toolchain/astro-toolchain.tar.gz -C /tmp/auradio-package-manifests toolchain/package.json toolchain/package-lock.json
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('/tmp/auradio-package-manifests/toolchain/package.json')); if(p.name!=='auradio-web'||p.dependencies.astro!=='7.3.3'||p.dependencies.react!=='19.3.0') throw Error('Unexpected toolchain');"
          cp /tmp/auradio-package-manifests/toolchain/package.json .
          cp /tmp/auradio-package-manifests/toolchain/package-lock.json .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m '构建：锁定官网已验证的依赖版本'
            git push origin HEAD:site/interactive-astro
          fi
