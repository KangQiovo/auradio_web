name: Check official preview sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-preview-sources.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check official public streams, without saving recordings
        shell: python
        run: |
          import urllib.request,json,pathlib,concurrent.futures
          out=pathlib.Path('/tmp/preview-health');out.mkdir()
          urls={
            'free-you':'https://music.163.com/song/media/outer/url?id=3436855494.mp3',
            'free-you-embed':'https://music.163.com/outchain/player?type=2&id=3436855494&auto=0&height=66',
            'therefore':'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/97/84/d0/9784d05a-00ba-7267-dabd-05d32d0d1d26/mzaf_7087379806817376478.plus.aac.p.m4a',
            'gem':'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/95/4b/89/954b89a2-8640-4cdf-f351-f37a30dd8092/mzaf_775675794511706545.plus.aac.p.m4a',
            'cover':'https://p2.music.126.net/VZvNu7YV2b2LXClpA1X9iQ==/109951173946368622.jpg'
          }
          def probe(item):
            name,url=item
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Origin':'https://auradio.kangqiovo.com','Range':'bytes=0-4095'})
              with urllib.request.urlopen(req,timeout=15) as r:
                data=r.read(65536 if name=='free-you-embed' else 4096)
                result={'name':name,'url':url,'final':r.geturl(),'status':r.status,'headers':dict(r.headers),'signature':data[:24].hex()}
                if name=='free-you-embed':result['html']=data.decode('utf8','replace')
              return result
            except Exception as e:return {'name':name,'error':str(e)}
          results=list(concurrent.futures.ThreadPoolExecutor(max_workers=5).map(probe,urls.items()))
          (out/'health.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          try:
            with urllib.request.urlopen(urls['cover'],timeout=12) as r:(out/'free-you.jpg').write_bytes(r.read(2000000))
          except Exception as e:print('Cover preview unavailable:',str(e))
          print(json.dumps([{k:v for k,v in r.items() if k not in ('html','headers')} for r in results],ensure_ascii=False))
      - uses: actions/upload-artifact@v4
        with:
          name: official-preview-health
          path: /tmp/preview-health
          retention-days: 1
