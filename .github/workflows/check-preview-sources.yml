name: Check official preview sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-preview-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-source-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public metadata only
        shell: python
        run: |
          import urllib.request, urllib.parse, json, re, pathlib, concurrent.futures
          out=pathlib.Path('/tmp/media-check');out.mkdir()
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=12) as r:return r.geturl(),dict(r.headers),r.read(3000000)
          def probe(url):
            try:
              final,headers,data=get(url);text=data.decode('utf8','replace')
              result={'url':url,'final':final,'type':headers.get('Content-Type'),'links':list(dict.fromkeys(re.findall(r'https?://[^\s<>"\']+',text)))[:40]}
              if 'json' in headers.get('Content-Type','') or text.lstrip().startswith('{'):result['metadata']=json.loads(text)
              return result
            except Exception as e:return {'url':url,'error':str(e)}
          urls=['https://t.cn/AXOXKXcP','https://t.cn/AXOXNjrS','https://music.163.com/api/search/get?s='+urllib.parse.quote('自由的你')+'&type=1&limit=5&offset=0','https://itunes.apple.com/search?term='+urllib.parse.quote('自由的你')+'&entity=song&country=hk&limit=5']
          results=list(concurrent.futures.ThreadPoolExecutor().map(probe,urls))
          for result in list(results):
            match=re.search(r'[?&]id=(\d+)',result.get('final',''))
            if match and '163.com' in result.get('final',''):results.append(probe('https://music.163.com/api/song/detail?ids=['+match.group(1)+']&id='+match.group(1)))
          for name,url in [('heartbeat','https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/55/bb/c7/55bbc782-299e-7f24-bc4a-ae129e6d8030/mzm.rpqttxch.jpg/600x600bb.jpg'),('gem','https://is1-ssl.mzstatic.com/image/thumb/Music6/v4/2e/23/c8/2e23c89b-580b-4a86-1a56-c6da0e92a182/887158493607_Cover.jpg/600x600bb.jpg')]:
            try:
              final,headers,data=get(url);(out/(name+'.jpg')).write_bytes(data)
              results.append({'artwork':name,'url':url,'type':headers.get('Content-Type'),'cors':headers.get('Access-Control-Allow-Origin')})
            except Exception as e:results.append({'artwork':name,'error':str(e)})
          (out/'metadata.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print('Public metadata collected; no full songs, cookies or credentials retrieved.')
      - uses: actions/upload-artifact@v4
        with:
          name: official-preview-metadata
          path: /tmp/media-check
          retention-days: 1
